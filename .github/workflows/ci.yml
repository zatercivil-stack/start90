name: CI — rules and browser flow

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test business rules
        run: npm test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local demo server
        run: |
          mkdir -p artifacts
          npm start > /tmp/start90-ci-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/start90-ci-server.log
          exit 1
      - name: Test complete browser scenario
        run: npm run test:e2e
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            test-results/
            artifacts/e2e-results.json
          if-no-files-found: ignore
